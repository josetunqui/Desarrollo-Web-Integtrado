<header class="header">
  <a routerLink="/inicio" class="logo">TechStore <span>Web</span></a>

  <nav class="menu">
    <a routerLink="/inicio" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="activo">Catálogo</a>
    <a routerLink="/registro" routerLinkActive="activo">Registro</a>
    <a routerLink="/carrito" routerLinkActive="activo">
      Carrito <span class="badge">{{ carrito.cantidadTotal() }}</span>
    </a>

    @if (auth.estaAutenticado()) {
      <a routerLink="/mi-cuenta" routerLinkActive="activo">Mi cuenta</a>
    }
    @if (auth.tieneRol('ROLE_ADMIN')) {
      <a routerLink="/admin/productos" routerLinkActive="activo">Administrar</a>
    }
  </nav>

  <div class="usuario">
    @if (auth.sesion(); as s) {
      <span>{{ s.usuario }} <small class="rol-chip">{{ s.rol }}</small></span>
      <button type="button" class="btn-rojo" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login" class="btn-rojo" style="text-decoration:none;">Iniciar sesión</a>
    }
  </div>
</header>
