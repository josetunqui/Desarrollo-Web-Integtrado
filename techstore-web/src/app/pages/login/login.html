<section class="login-tarjeta">
  <h2>Iniciar Sesión</h2>
  <p class="nota">Acceso seguro con control de roles y credenciales para el panel de TechStore.</p>

  @if (volver()) {
    <div class="aviso-volver">
      Necesitas iniciar sesión para ver: <strong>{{ volver() }}</strong>
    </div>
  }

  <form (ngSubmit)="ingresar()" class="form-login">
    <div class="campo">
      <label for="user">Usuario</label>
      <input id="user" name="user" [(ngModel)]="username" />
    </div>

    <div class="campo">
      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" [(ngModel)]="password" />
    </div>

    <button type="submit" class="btn">Ingresar como Administrador</button>
  </form>
</section>
